on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# This workflow is the only definition of how the resume is built. Each stage
# runs in the image that owns its toolchain, and hands the next stage its
# output as an artifact - no stage needs another stage's tools installed.
jobs:
  fmt:
    runs-on: ubuntu-latest
    container: denoland/deno:latest@sha256:a0d88a7fcbd44f062cba2748e19df67d30290ad12aa203c7c1e0b12462c483f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: deno fmt --check

  render:
    name: Render LaTeX from resume data
    runs-on: ubuntu-latest
    container: denoland/deno:latest@sha256:a0d88a7fcbd44f062cba2748e19df67d30290ad12aa203c7c1e0b12462c483f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /deno-dir
          key: deno-${{ hashFiles('deno.lock') }}
      - run: deno task validate
      - run: mkdir -p out
      - run: deno task render
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tex
          path: out/resume.tex

  compile:
    name: Compile PDF
    runs-on: ubuntu-latest
    container: texlive/texlive:latest@sha256:540d736c78e2803cdd7b6a196bd21339c30185948db55e04e75a415959102ca8
    needs:
      - render
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tex
          path: out
      # LuaTeX specifically, not XeTeX/tectonic; see the README for why.
      - run: |
          lualatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory=out \
            out/resume.tex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resume
          path: out/resume.pdf

  thumbnail:
    name: Render thumbnail
    runs-on: ubuntu-latest
    container: minidocks/poppler:latest@sha256:9a87f7f864107b9b3ea7976a32a69d4763bd4957e9d48865506a6867d0816c5f
    needs:
      - compile
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: resume
          path: out
      - run: pdftoppm -png -singlefile out/resume.pdf out/thumbnail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thumbnail
          path: out/thumbnail.png

  ci-check:
    name: Check all statuses are green
    if: always()
    needs:
      - fmt
      - render
      - compile
      - thumbnail
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - compile
      - thumbnail
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # semantic-release needs the full commit history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{resume,thumbnail}"
          merge-multiple: true
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/release/package.json
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --prefix .github/release
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release
