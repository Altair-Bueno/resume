on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: typstyle aqua:oxc-project/oxc/oxfmt
      - run: mise run fmt

  validate:
    name: Validate resume data against its schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: jsonschema
      - run: mise run validate

  test:
    name: Run template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: github:typst-community/tytanic
      - run: mise run test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diffs
          path: tests/**/diff/

  reading-order:
    name: Check text extraction order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: typst conda:poppler
      - run: mise run reading-order
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture
          path: out/fixture.pdf

  variants:
    name: List resume variants
    runs-on: ubuntu-latest
    needs:
      - validate
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: typst
      - id: list
        run: echo "list=$(mise run --quiet variants)" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile ${{ matrix.variant }} resume
    runs-on: ubuntu-latest
    needs:
      - variants
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: typst
      - run: mise run build "$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-${{ matrix.variant }}
          path: |
            out/*.pdf
            out/*.png

  ci-check:
    name: Check all statuses are green
    if: always()
    needs:
      - fmt
      - validate
      - test
      - reading-order
      - variants
      - compile
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - compile
      - test
      - reading-order
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: resume-*
          merge-multiple: true
          path: out
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node npm:semantic-release
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release
