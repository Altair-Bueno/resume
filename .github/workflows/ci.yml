on:
  push:
    branches:
      - "*"
    tags:
      - "*"

permissions:
  contents: read # for checkout

# This workflow is the only definition of how the resume is built. Each stage
# runs in the image that owns its toolchain, and hands the next stage its
# output as an artifact - no stage needs another stage's tools installed.
jobs:
  fmt:
    runs-on: ubuntu-latest
    container: denoland/deno:latest
    steps:
      - uses: actions/checkout@v4
      - run: deno fmt --check

  render:
    name: Render LaTeX from resume data
    runs-on: ubuntu-latest
    container: denoland/deno:latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - run: |
          deno run -q \
            --allow-read=. \
            --allow-write=. \
            --no-prompt \
            scripts/hbs.ts \
            --hbs.strict \
            -d data/resume.yml \
            templates/rezume.hbs \
            -o out/resume.tex
      - uses: actions/upload-artifact@v4
        with:
          name: tex
          path: out/resume.tex

  compile:
    name: Compile PDF
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    needs:
      - render
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tex
          path: out
      # LuaTeX specifically, not XeTeX/tectonic. No engine emits space glyphs -
      # word gaps are TJ offsets, and extractors tell them from letter kerns by
      # magnitude. The sourcesanspro "type1" option is what makes that possible:
      # TeX kerns only a few letter pairs, leaving word gaps distinctly larger,
      # whereas XeTeX positions every glyph via HarfBuzz and the gaps blur
      # together. XeTeX also maps f-ligature glyphs to U+FB01/U+FB02, leaving
      # words like "InfluxDB" and "CERTIFICATIONS" unsearchable.
      - run: |
          lualatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory=out \
            out/resume.tex
      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: out/resume.pdf

  thumbnail:
    name: Render thumbnail
    runs-on: ubuntu-latest
    container: minidocks/poppler:latest
    needs:
      - compile
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume
          path: out
      - run: pdftoppm -png -singlefile out/resume.pdf out/thumbnail
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: out/thumbnail.png

  ci-check:
    name: Check all statuses are green
    if: always()
    needs:
      - fmt
      - render
      - compile
      - thumbnail
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - compile
      - thumbnail
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    if: >
      startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref,
      'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full commit history
      - uses: actions/download-artifact@v4
        with:
          name: resume
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: thumbnail
          path: out
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
