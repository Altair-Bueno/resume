on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  TYPST_ROOT: .
  TYPST_FONT_PATHS: fonts
  TYPST_IGNORE_SYSTEM_FONTS: "true"

# This workflow is the only definition of how the resume is built.
jobs:
  fmt:
    runs-on: ubuntu-latest
    container: denoland/deno:latest@sha256:a0d88a7fcbd44f062cba2748e19df67d30290ad12aa203c7c1e0b12462c483f0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: deno fmt --check .

  validate:
    name: Validate resume data against its schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/validate/requirements.txt
      - run: pip install -r .github/validate/requirements.txt
      - run: check-jsonschema --check-metaschema data/resume.schema.json
      - run: check-jsonschema --schemafile data/resume.schema.json data/resume.yml tests/fixtures/resume.yml

  test:
    name: Run template tests
    runs-on: ubuntu-latest
    container: ghcr.io/typst-community/tytanic:0.4.1@sha256:c365ef5b13a5cd0d307823aa359951f3b9aabdff3ba4d767fa00075a646992d3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tt run --font-path fonts --no-use-system-fonts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diffs
          path: tests/**/diff/

  fixture:
    name: Compile the fixture resume
    runs-on: ubuntu-latest
    container: ghcr.io/typst/typst:0.15.1@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: typst compile --pdf-standard ua-1 --input data=/tests/fixtures/resume.yml templates/resume.typ fixture.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture
          path: fixture.pdf

  reading-order:
    name: Check text extraction order
    runs-on: ubuntu-latest
    container: minidocks/poppler:latest@sha256:213f4337c9e21ba7301058ba8c456a9c82acbb603caef05e4a78585af2e6964e
    needs:
      - fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fixture
      - run: tests/reading-order.sh fixture.pdf tests/fixtures/reading-order.txt

  variants:
    name: List resume variants
    runs-on: ubuntu-latest
    needs:
      - validate
    container: ghcr.io/typst/typst:0.15.1@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        run: |
          list=$(typst eval 'query(<variants>).first().value' --in templates/resume.typ)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile ${{ matrix.variant }} resume
    runs-on: ubuntu-latest
    container: ghcr.io/typst/typst:0.15.1@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
    needs:
      - variants
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Typst reports a missing font as a warning, so fail on any warning.
      # Package download progress also goes to stderr, so match on the label.
      - run: |
          if [ "$VARIANT" = full ]; then name=resume; else name="resume-$VARIANT"; fi
          mkdir -p out
          {
            typst compile --pdf-standard ua-1 --input "variant=$VARIANT" templates/resume.typ "out/$name.pdf" &&
            if [ "$VARIANT" = full ]; then
              typst compile --pages 1 --ppi 150 templates/resume.typ out/thumbnail.png
            fi
          } 2> diagnostics.txt || { cat diagnostics.txt; exit 1; }
          cat diagnostics.txt
          ! grep -q '^warning' diagnostics.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-${{ matrix.variant }}
          path: out/

  ci-check:
    name: Check all statuses are green
    if: always()
    needs:
      - fmt
      - validate
      - test
      - fixture
      - reading-order
      - variants
      - compile
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - compile
      - test
      - reading-order
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # semantic-release needs the full commit history
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: resume-*
          merge-multiple: true
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .github/release/package.json
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --prefix .github/release
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release
